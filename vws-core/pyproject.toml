[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scalp-city-vws-core"
version = "0.1.0"
description = "Deterministic read-only trading defense and immutable audit ledger"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.1", "pydantic-settings==2.16.0", "SQLAlchemy==2.1.5",
  "alpaca-py==0.44.0", "plaid-python==45.0.0", "pandas==3.0.6",
  "exchange-calendars==4.13.2", "tenacity==9.2.1", "structlog==26.1.0",
  "cryptography==50.0.2", "requests==2.34.2", "tzdata==2026.5",
  "openai==3.32.0", "python-telegram-bot==22.8", "APScheduler==3.11.3",
  "httpx==0.28.1", "feedparser==6.0.14", "numpy==2.5.3", "PyYAML==6.0.3",
  "keyring==25.7.0",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1", "pytest-cov==7.1.0", "pytest-socket==0.8.1",
  "hypothesis==6.170.1", "mutmut==3.8.0", "ruff==0.17.1", "mypy==2.4.0",
  "pandas-stubs==3.0.5.260914", "bandit==1.9.4", "pip-audit==2.10.1",
  "detect-secrets==1.5.0", "pre-commit==4.7.0", "types-requests==2.33.0.20261006",
  "pytest-asyncio==1.4.0", "types-PyYAML==6.0.12.20260906",
  "pip-tools==7.6.2",
  "cyclonedx-bom==7.5.0",
]

[project.scripts]
vws = "vws.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*", "vws*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--disable-socket --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: explicit paper-key integration checks (not run by default)", "perf: fixed synthetic tape and prescribed runtime budgets"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/spec/**", "deliveries/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend", "scripts", "vws"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "alpaca.*", "plaid.*", "tenacity.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["backend.core.system_state", "backend.risk", "backend.domain.compliance_models", "backend.execution.alpaca_executor"]

[tool.bandit]
exclude_dirs = ["backend/tests", ".venv", "mutants"]

[tool.mutmut]
source_paths = ["backend/risk/", "backend/notifications/callbacks.py", "backend/agents/fundamentals.py", "backend/tax/lots.py", "backend/tax/accounting.py", "backend/tax/reports.py", "backend/execution/alpaca_executor.py", "backend/execution/modes.py", "backend/execution/policy.py"]
also_copy = ["backend", "config", "scripts", "vws", "prompts", "docs"]
pytest_add_cli_args_test_selection = ["backend/tests/test_risk_cro.py", "backend/tests/test_compliance.py", "backend/tests/test_wash_sales.py", "backend/tests/test_compliance_boundary.py", "backend/tests/test_stage_c_adversarial.py", "backend/tests/test_swarm_and_callbacks.py", "backend/tests/test_fundamentals.py", "backend/tests/test_tax_accounting.py", "backend/tests/test_tax_reports.py", "backend/tests/test_tax_guards.py", "backend/tests/test_auto_execution.py", "backend/tests/test_auto_exits.py", "backend/tests/test_auto_admission.py", "backend/tests/test_auto_contracts.py", "backend/tests/test_auto_safety.py", "backend/tests/test_execution_policy.py", "backend/tests/test_live_unlock.py"]
pytest_add_cli_args = ["--disable-socket", "-q"]
