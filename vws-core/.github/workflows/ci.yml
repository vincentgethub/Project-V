    defaults:
      run:
        working-directory: vws-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hashed dependencies and local source
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Prove complete disjoint file function and mutant assignments
        env:
          VWS_MUTATION_SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import fnmatch
          import json
          import os
          import tomllib
          from collections import Counter
          from pathlib import Path
          from importlib.metadata import version

          import yaml
          from mutmut.mutation.file_mutation import compute_function_hashes, mutate_file_contents
          from mutmut.utils.format_utils import get_mutant_name


          def require(condition, message):
              if not condition:
                  raise SystemExit("Mutation shard coverage FAIL: " + message)


          require(version("mutmut") == "3.8.0", "unexpected generator version")
          workflow = yaml.safe_load(Path("../.github/workflows/ci.yml").read_text(encoding="utf-8"))
          rows = workflow["jobs"]["mutations"]["strategy"]["matrix"]["include"]
          require(len(rows) == 6, "expected six shards")
          require(len({row["shard"] for row in rows}) == len(rows), "duplicate shard name")
          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["mutmut"]
          configured = set()
          for value in config["source_paths"]:
              path = Path(value)
              require(path.exists(), "configured path missing: " + value)
              files = sorted(path.rglob("*.py")) if path.is_dir() else [path]
              require(bool(files), "configured path has no files: " + value)
              configured.update(file.as_posix() for file in files)
          assigned_files = {path for row in rows for path in row["paths"]}
          require(assigned_files == configured, "unassigned or unexpected configured file")
          require(all(len(row["paths"]) == len(set(row["paths"])) for row in rows), "duplicate shard path")
          executor = "backend/execution/alpaca_executor.py"
          file_owners = Counter(path for row in rows for path in row["paths"])
          require(all(count == (2 if path == executor else 1) for path, count in file_owners.items()),
                  "file assignment overlaps")
          selected = {row["shard"]: set() for row in rows}
          generated_by_path = {}
          for filename in sorted(configured):
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              functions = set(compute_function_hashes(source))
              owners = [row for row in rows if filename in row["paths"]]
              function_owners = {}
              for row in owners:
                  explicit = row.get("functions")
                  require((explicit is not None) == (filename == executor), "invalid function partition")
                  names = explicit if explicit is not None else sorted(functions)
                  require(len(names) == len(set(names)), "duplicate function assignment")
                  require(set(names) <= functions, "unknown assigned function in " + filename)
                  for name in names:
                      require(name not in function_owners, "overlapping function in " + filename)
                      function_owners[name] = row["shard"]
              require(set(function_owners) == functions, "unassigned function in " + filename)
              mutated = mutate_file_contents(str(path), source)
              names = list(mutated.mutant_names)
              require(len(names) == len(set(names)), "duplicate generated mutant")
              generated_by_path[filename] = set()
              for name in names:
                  function = name.rsplit("__mutmut_", 1)[0]
                  require(function in function_owners, "unassigned mutant function in " + filename)
                  key = get_mutant_name(path, name)
                  generated_by_path[filename].add(key)
                  selected[function_owners[function]].add(key)
          all_mutants = set().union(*generated_by_path.values())
          require(sum(map(len, generated_by_path.values())) == len(all_mutants),
                  "duplicate mutant ID across files")
          require(len(all_mutants) == 13381, "generated total differs from 13381")
          require(sum(map(len, selected.values())) == len(all_mutants), "overlapping mutants")
          require(set().union(*selected.values()) == all_mutants, "unassigned mutants")
          for row in rows:
              require(len(selected[row["shard"]]) == row["count"], "shard count changed: " + row["shard"])
          executor_rows = [row for row in rows if executor in row["paths"]]
          a, b = (selected[row["shard"]] for row in executor_rows)
          require(not a & b and a | b == generated_by_path[executor] and len(a | b) == 5159,
                  "executor overlap or coverage mismatch")
          current = [row for row in rows if row["shard"] == os.environ["VWS_MUTATION_SHARD"]]
          require(len(current) == 1, "unknown current shard")
          row = current[0]
          generated = set().union(*(generated_by_path[path] for path in row["paths"]))
          patterns = [get_mutant_name(Path(executor), name + "__mutmut_*")
                      for name in row.get("functions", [])]
          matched = {key for key in generated if any(fnmatch.fnmatchcase(key, pattern) for pattern in patterns)} if patterns else generated
          require(matched == selected[row["shard"]], "CLI selection differs from assigned mutants")
          manifest = {"shard": row["shard"], "paths": row["paths"], "patterns": patterns,
                      "expected_count": row["count"], "selected": sorted(selected[row["shard"]]),
                      "generated": sorted(generated)}
          Path(os.environ["RUNNER_TEMP"], "vws-mutation-shard.json").write_text(
              json.dumps(manifest, ensure_ascii=True), encoding="utf-8")
          print("Verified all 18 files, all functions, 13381 unique mutants; executor overlap=0, union=5159")
          print("Shard:", row["shard"], "expected mutants:", row["count"])
          PY
      - name: Mutate every assigned mutant and enforce the unchanged 100 percent gate
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path


          def require(condition, message):
              if not condition:
                  raise SystemExit("Mutation shard results FAIL: " + message)


          manifest = json.loads(Path(os.environ["RUNNER_TEMP"], "vws-mutation-shard.json").read_text())
          project = Path("pyproject.toml")
          original = project.read_text(encoding="utf-8")
          before = tomllib.loads(original)
          patched, changes = re.subn(r"(?m)^source_paths = .*?$",
                                     "source_paths = " + json.dumps(manifest["paths"]), original)
          require(changes == 1, "could not select shard paths")
          after = tomllib.loads(patched)
          expected = json.loads(json.dumps(before))
          expected["tool"]["mutmut"]["source_paths"] = manifest["paths"]
          require(after == expected, "configuration changed beyond shard paths")
          project.write_text(patched, encoding="utf-8")
          subprocess.run([sys.executable, "-m", "scripts.profile_mutations", *manifest["patterns"]], check=True)
          result = subprocess.run([sys.executable, "-m", "mutmut", "results", "--all", "true"],
                                  check=True, capture_output=True, text=True)
          records = {}
          for line in result.stdout.splitlines():
              key, separator, status = line.strip().partition(": ")
              require(bool(separator) and key not in records, "malformed or duplicate result")
              records[key] = status
          require(set(records) == set(manifest["generated"]), "missing or unexpected generated results")
          selected = manifest["selected"]
          require(len(selected) == len(set(selected)) == manifest["expected_count"], "invalid assigned count")
          # Reversible, collision-free ASCII IDs preserve the existing checker's identifier grammar.
          lines = ["m_" + key.encode("utf-8").hex() + ": " + records[key] for key in selected]
          output = Path(os.environ["RUNNER_TEMP"], "vws-mutants.txt")
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          subprocess.run([sys.executable, "-m", "scripts.check_mutations", str(output)], check=True)
          print("Shard:", manifest["shard"], "complete 100% gate:", len(selected), "mutants")
          PY
  mutations-gate:
    needs: mutations
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vws-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require every mutation shard to succeed
        env:
          MUTATIONS_RESULT: ${{ needs.mutations.result }}
        run: |
          test "$MUTATIONS_RESULT" = success
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_DB: vws_ci
          POSTGRES_USER: vws_ci
          POSTGRES_PASSWORD: CI_FIXTURE_ONLY # pragma: allowlist secret - public disposable CI fixture
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: vws-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hashed dependencies and local source
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Trigger and concurrent writer tests on explicit disposable database
        run: python -m pytest -q backend/tests/test_postgres.py --postgres-test-url 'postgresql+psycopg://vws_ci:CI_FIXTURE_ONLY@127.0.0.1:5432/vws_ci' # pragma: allowlist secret - public disposable CI fixture
