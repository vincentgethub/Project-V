# GD-02: research parameters only. Risk ceilings and secrets live in env settings.
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - SPY
  - QQQ
  - XLK
schedule:
  scan_interval_minutes: 15
  offhours_interval_minutes: 60
  scheduler_misfire_grace_seconds: 60
  daily_bar_sip_lag_seconds: 900
alerts:
  alert_cooldown_sessions: 1
playbooks:
  TREND_50EMA:
    criteria_weights:
      trend: 0.40
      reclaim: 0.35
      relative_volume: 0.25
    stop_atr_mult: 2.0
    target_r: 2.0
  BASE_BREAKOUT:
    criteria_weights:
      breakout: 0.45
      relative_volume: 0.35
      trend: 0.20
    stop_atr_mult: 2.0
    target_r: 2.0
  ANCHORED_VWAP_RECLAIM:
    criteria_weights:
      reclaim: 0.45
      momentum: 0.30
      relative_volume: 0.25
    stop_atr_mult: 2.0
    target_r: 2.0
