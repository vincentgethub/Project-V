# GD-02: research parameters only. Risk ceilings and secrets live in env settings.
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - JNJ
  - JPM
  - AMZN
  - GOOGL
  - META
  - AVGO
  - ORCL
  - COST
  - WMT
  - PG
  - XOM
  - CVX
  - UNH
  - ABBV
  - HD
  - CAT
  - KO
  - SPY
  - XLK
  - XLC
  - XLY
  - XLP
  - XLE
  - XLF
  - XLI
  - XLB
  - XLRE
  - XLU
  - XLV
schedule:
  monitor_interval_minutes: 15
  offhours_news_interval_minutes: 60
  scheduler_misfire_grace_seconds: 60
  daily_bar_sip_lag_seconds: 960
  daily_scan_delay_minutes: 30
alerts:
  alert_cooldown_sessions: 1
egress:
  # Additional entries require both a DNS host and a readable comment.
  extra_hosts: []
news:
  # RSS is secondary. Only explicit HTTPS feeds receive network grants.
  rss_urls: []
fundamentals:
  enabled: true
  mode: annotate
  gross_margin_min: 0.40
  operating_margin_min: 0.15
  roic_min: 0.10
  fcf_min: 0
  interest_coverage_min: 3.0
  exempt_sectors: [Financials, Real Estate]
  max_filing_age_days: 200
  cache_hours: 24
sizing:
  target_risk_per_trade: 0.005
  max_stop_pct: 0.12
  stop_atr_mult: 2.0
  target_r: 2.0
  swing_lookback: 10
cm:
  spread_floor_bps: {high: 2, mid: 5, low: 15}
  stop_slip_atr_frac: 0.05
  max_participation: 0.01
evaluation:
  max_hold_sessions: 20
playbooks:
  TREND_50EMA:
    criteria_weights:
      trend: 0.20
      slope: 0.20
      pullback: 0.20
      range_position: 0.15
      relative_volume: 0.10
      rsi: 0.15
  BASE_BREAKOUT:
    criteria_weights:
      breakout: 0.20
      relative_volume: 0.20
      base_range: 0.20
      trend: 0.20
      rsi: 0.10
      range_position: 0.10
  ANCHORED_VWAP_RECLAIM:
    criteria_weights:
      reclaim: 0.20
      relative_volume: 0.20
      slope: 0.20
      atr_risk: 0.20
      rsi: 0.10
      range_position: 0.10
