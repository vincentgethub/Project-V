# GD-02: research parameters only. Risk ceilings and secrets live in env settings.
# XK-03/05/06: registered reduction controls; no parameter optimization.
regime_filter:
  manual: annotate
  auto: half_size
playbook_kill:
  min_trades: 30
ramp:
  first_after: 10
  more_after: 20
  steps: ["0.25", "0.50", "1"]
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - JNJ
  - JPM
  - AMZN
  - GOOGL
  - META
  - AVGO
  - ORCL
  - COST
  - WMT
  - PG
  - XOM
  - CVX
  - UNH
  - ABBV
  - HD
  - CAT
  - KO
  - SPY
  - XLK
  - XLC
  - XLY
  - XLP
  - XLE
  - XLF
  - XLI
  - XLB
  - XLRE
  - XLU
  - XLV
schedule:
  monitor_interval_minutes: 15
  offhours_news_interval_minutes: 60
  scheduler_misfire_grace_seconds: 60
  daily_bar_sip_lag_seconds: 960
  daily_scan_delay_minutes: 30
alerts:
  alert_cooldown_sessions: 1
egress:
  # Additional entries require both a DNS host and a readable comment.
  extra_hosts:
    - {host: www.nasdaqtrader.com, comment: RT-03 public trade halt RSS}
    - {host: www.federalreserve.gov, comment: RT-08 official schedule refresh only}
    - {host: www.bls.gov, comment: RT-08 official schedule refresh only}
    - {host: www.bea.gov, comment: RT-08 official schedule refresh only}
lj: {min_tag_n: 15, narrative_llm: false}
lp: {mine_cron: weekly, max_open_proposals: 10}
rt:
  clock_skew_ms: 500
  news_stale_sec: 120
  asset_poll_sec: 60
  ca_stale_hours: 36
  halt_poll_sec: 60
  vix_stress: 30
  required_feeds: [clock, halts, news, assets]
  hard_events: {halt: block_entries, delisting: true, dilution: alert_only, mwc1: half_size, mwc2: half_size, mwc3: no_new_entries}
news:
  # RSS is secondary. Only explicit HTTPS feeds receive network grants.
  rss_urls: []
fundamentals:
  enabled: true
  mode: annotate
  gross_margin_min: 0.40
  operating_margin_min: 0.15
  roic_min: 0.10
  fcf_min: 0
  interest_coverage_min: 3.0
  exempt_sectors: [Financials, Real Estate]
  max_filing_age_days: 200
  cache_hours: 24
sizing:
  target_risk_per_trade: 0.005
  max_stop_pct: 0.12
  stop_atr_mult: 2.0
  target_r: 2.0
  swing_lookback: 10
cm:
  spread_floor_bps: {high: 2, mid: 5, low: 15}
  stop_slip_atr_frac: 0.05
  max_participation: 0.01
evaluation:
  max_hold_sessions: 20
qv:
  holdout_months: 18
  test_months: 6
  min_train_trades: 50
  max_variants_per_family: 8
  max_variants_total: 24
  bootstrap_resamples: 10000
  seed: 20261006
pr:
  corr_threshold: 0.70
  corr_lookback: 60
  corr_multipliers: [1.0, 0.75, 0.5, 0.25]
  vol_anchor: 0.16
rs:
  sector_filter: annotate
  top_n_sectors: 4
  min_stock_percentile: 0
  use_breadth: false
exits: {variant: BASELINE}
ex: {trail_atr_mult: 3.0}
gv:
  min_paper_trades: 50
  min_sessions: 60
  max_drawdown: 0.10
  benchmark_sharpe_tolerance: 0.2
  no_halt_sessions: 20
  drill_max_age_days: 31
  ready_max_age_days: 35
playbooks:
  enabled: [TREND_50EMA, BASE_BREAKOUT, ANCHORED_VWAP_RECLAIM]
  TREND_50EMA:
    criteria_weights:
      trend: 0.20
      slope: 0.20
      pullback: 0.20
      range_position: 0.15
      relative_volume: 0.10
      rsi: 0.15
  BASE_BREAKOUT:
    criteria_weights:
      breakout: 0.20
      relative_volume: 0.20
      base_range: 0.20
      trend: 0.20
      rsi: 0.10
      range_position: 0.10
  ANCHORED_VWAP_RECLAIM:
    criteria_weights:
      reclaim: 0.20
      relative_volume: 0.20
      slope: 0.20
      atr_risk: 0.20
      rsi: 0.10
      range_position: 0.10
