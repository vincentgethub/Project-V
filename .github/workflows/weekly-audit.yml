name: Weekly locked dependency audit
on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.VWS_PROJECT_DIR || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4; verified official ref
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5; verified official ref
        with:
          python-version: '3.12'
      - name: Locate project
        working-directory: .
        run: |
          if [ -f pyproject.toml ]; then
            echo 'VWS_PROJECT_DIR=.' >> "$GITHUB_ENV"
          else
            echo 'VWS_PROJECT_DIR=vws-core' >> "$GITHUB_ENV"
          fi
      - name: Install only hashed pins
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Audit locks; any vulnerability fails the job
        run: |
          python -m pip_audit -r requirements.lock --no-deps --disable-pip --progress-spinner off --timeout 15
          python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip --progress-spinner off --timeout 15
      - name: Build public lock inventories
        # VERIFY: pinned cyclonedx-py 7.5.0 CLI usage and local --help.
        run: |
          mkdir -p build/sbom
          python -m cyclonedx_py requirements requirements.lock --output-format JSON --output-file build/sbom/runtime.json
          python -m cyclonedx_py requirements requirements-dev.lock --output-format JSON --output-file build/sbom/development.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0; official tag verified 2026-10-08
        with:
          name: weekly-dependency-sboms
          path: '**/build/sbom/*.json'
          if-no-files-found: error
          retention-days: 30
