name: Diagnostic mutation pilot (never a gate)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: vws-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install existing hashed development dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - id: plan
        name: Prove dispatch-only diagnostic union and fixed sample
        run: python -m scripts.mutation_pilot plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostic-pilot-plan
          path: vws-core/build/mutation-pilot/plan.json
          if-no-files-found: error
          retention-days: 30
  measurements:
    name: diagnostic (${{ matrix.batch }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: vws-core
    env:
      VWS_PILOT_BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install existing hashed development dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Prepare isolated diagnostic batch with unchanged covering-test selector
        run: python -m scripts.mutation_pilot prepare --batch "$VWS_PILOT_BATCH"
      - name: Measure native mutants (no gate certification)
        run: |
          directory="$PWD/build/mutation-pilot/$VWS_PILOT_BATCH"
          export VWS_MUTATION_AUDIT_DIR="$directory/$VWS_PILOT_BATCH-audit"
          mapfile -t ids < "$directory/native-ids.txt"
          python -m mutmut run "${ids[@]}"
      - name: Export native statuses for diagnostics only
        if: always()
        run: python -m mutmut results --all true > "build/mutation-pilot/$VWS_PILOT_BATCH/native-results.txt"
      - name: Retain timings, sanitized frames, survivors and missing IDs
        if: always()
        run: python -m scripts.mutation_pilot finish --batch "$VWS_PILOT_BATCH"
      - name: Publish diagnostic evidence (not a mutation-result artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostic-pilot-${{ matrix.batch }}
          path: |
            vws-core/build/mutation-pilot/${{ matrix.batch }}/${{ matrix.batch }}.json
            vws-core/build/mutation-pilot/${{ matrix.batch }}/${{ matrix.batch }}-audit/
            vws-core/build/mutation-pilot/${{ matrix.batch }}/${{ matrix.batch }}-evidence/
          if-no-files-found: error
          retention-days: 30
  report:
    name: Diagnostic observations only (not mutation aggregate)
    needs: [plan, measurements]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vws-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install existing hashed development dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: diagnostic-pilot-pilot-*
          path: vws-core/build/mutation-pilot
          merge-multiple: false
      - name: Restore batch directories from diagnostic artifact names
        run: |
          python -c "from pathlib import Path; root=Path('build/mutation-pilot'); [path.rename(root/path.name.removeprefix('diagnostic-pilot-')) for path in root.glob('diagnostic-pilot-pilot-*')]"
      - name: Summarize measured coverage without certifying any gate
        run: python -m scripts.mutation_pilot summarize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: diagnostic-pilot-summary
          path: vws-core/build/mutation-pilot/summary/
          if-no-files-found: error
          retention-days: 30
