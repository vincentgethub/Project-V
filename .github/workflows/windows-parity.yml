name: Windows parity gates (manual diagnostic)
on:
  workflow_dispatch: {}
  push:
    branches: [windows-parity-draft]
permissions:
  contents: read
jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
        working-directory: vws-core
    steps:
      - name: Keep LF line endings so fingerprints and hashed files match Linux
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same pin as ci.yml verify
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, same pin as ci.yml verify
        with:
          python-version: '3.12'
      - name: Install hashed dependencies and local source
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Regenerate fingerprint map and prove child ownership
        # Same checks as ci.yml; the baseline is unpacked with git archive --format=zip plus python -m zipfile
        # instead of tar, because a Windows drive-letter path (D:\...) is read by GNU tar as host:path.
        run: |
          baseline="$RUNNER_TEMP/vws-fingerprint-baseline"
          mkdir -p "$baseline"
          git -C .. archive --format=zip 5dc9af896d3fec6bc8e1b38eb2159641a740b27a vws-core -o "$RUNNER_TEMP/vws-fingerprint-baseline.zip"
          python -m zipfile -e "$RUNNER_TEMP/vws-fingerprint-baseline.zip" "$baseline"
          python -m scripts.mutation_fingerprints --baseline "$baseline/vws-core" --check
          cmp config/mutation-parent-jobs.json "$baseline/vws-core/config/mutation-shards.json"
          python -m scripts.mutation_children --check
      - name: Lint and format
        run: python -m ruff check . && python -m ruff format --check .
      - name: Strict authored-source typing
        run: python -m backend.core.check_stage_d
      - name: Execution source guard
        run: python -m backend.core.source_guard .
      - name: Production source security checks
        run: python -m bandit -r backend/core backend/domain backend/risk backend/data backend/agents backend/net backend/ops backend/security backend/telegram backend/notifications backend/tax backend/funding backend/pnl backend/evaluation backend/indicators backend/execution backend/learning backend/realtime scripts vws -c pyproject.toml
      - name: Audit runtime and development dependency locks
        run: |
          python -m pip_audit -r requirements.lock --no-deps --disable-pip --progress-spinner off --timeout 15
          python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip --progress-spinner off --timeout 15
      - name: CycloneDX SBOMs from both hashed locks
        run: |
          mkdir -p build/sbom
          python -m cyclonedx_py requirements requirements.lock --output-format JSON --output-file build/sbom/runtime.json
          python -m cyclonedx_py requirements requirements-dev.lock --output-format JSON --output-file build/sbom/development.json
      - name: Upload public dependency inventories
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, same pin as ci.yml verify
        with:
          name: dependency-sboms-windows
          path: '**/build/sbom/*.json'
          if-no-files-found: error
          retention-days: 30
      - name: Scan authored files for secrets
        # Same scan and exclusions as ci.yml; the report goes to $RUNNER_TEMP instead of /tmp, because bash
        # /tmp and the Windows Python's /tmp are different directories on this runner.
        run: |
          python -m detect_secrets scan --all-files --exclude-files '(^|[\\/])(\.venv|backend[\\/]tests|deliveries|\.git|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.hypothesis|__pycache__|mutants|build|dist)[\\/]' > "$RUNNER_TEMP/vws-secrets.json"
          VWS_SECRETS_REPORT="$RUNNER_TEMP/vws-secrets.json" python -c "import json, os; from pathlib import Path; findings=json.loads(Path(os.environ['VWS_SECRETS_REPORT']).read_text())['results']; print('Authored secret findings:', sum(len(items) for items in findings.values())); assert not findings"
      - name: Owner progress page updated with code
        # Same check as ci.yml; the changed-file list goes to $RUNNER_TEMP instead of /tmp (same reason as above).
        run: |
          git diff-tree --root --no-commit-id --name-only -r HEAD > "$RUNNER_TEMP/vws-changed-files.txt"
          VWS_CHANGED_FILES="$RUNNER_TEMP/vws-changed-files.txt" python -c "import os; from pathlib import Path; from vws.progress import read_progress, require_progress_update; read_progress(); require_progress_update(tuple(Path(os.environ['VWS_CHANGED_FILES']).read_text().splitlines()))"
      - name: Offline tests and complete risk/state/fundamentals/card/tax branch coverage
        run: python -m pytest -q -m 'not perf' --cov=backend.core.system_state --cov=backend.risk --cov=backend.domain.compliance_models --cov=backend.agents.fundamentals --cov=backend.notifications --cov=backend.tax --cov=backend.evaluation --cov=backend.execution.alpaca_executor --cov-branch --cov-fail-under=100 --cov-report=term-missing
      - name: Prescribed synthetic performance workloads without coverage overhead
        env:
          VWS_PERF_BUDGET_SECONDS: '420'
        run: python -m pytest -q -s -m perf --no-cov backend/tests/test_replay_cli.py backend/tests/test_v_performance.py backend/tests/test_w_perf.py
