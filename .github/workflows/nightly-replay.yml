name: Nightly offline replay
# Item 5: scheduled run of the existing replay. Read-only, offline synthetic
# fixtures, no secrets, nothing written back to the repository.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Single flight: one run at a time; a running job is never canceled.
concurrency:
  group: vws-nightly-replay
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vws-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified official ref
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; verified official ref
        with:
          python-version: '3.12'
      - name: Install only hashed pins
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Existing replay tests (offline)
        run: python -m pytest -q -m 'not perf' backend/tests/test_replay_cli.py
      - name: Existing replay performance budget (synthetic tape)
        env:
          VWS_PERF_BUDGET_SECONDS: '420'
        run: python -m pytest -q -s -m perf backend/tests/test_replay_cli.py
      - name: Offline CLI replay on synthetic fixtures
        run: python -m vws replay --start 2026-08-01 --end 2026-10-02 --symbols NVDA AVGO --offline-fixtures --reports "$RUNNER_TEMP/replay/reports" --cache "$RUNNER_TEMP/replay/cache" --workers 1
