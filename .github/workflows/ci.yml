name: Defensive core and audit fixes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.VWS_PROJECT_DIR || '.' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate project
        working-directory: .
        run: |
          if [ -f pyproject.toml ]; then
            echo 'VWS_PROJECT_DIR=.' >> "$GITHUB_ENV"
          else
            echo 'VWS_PROJECT_DIR=vws-core' >> "$GITHUB_ENV"
          fi
      - name: Install exact dependencies
        run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Lint and format
        run: python -m ruff check . && python -m ruff format --check .
      - name: Strict authored-source typing
        run: python -m mypy --strict
      - name: Execution source guard
        run: python -m backend.core.source_guard .
      - name: Security checks
        run: python -m bandit -r backend/core backend/domain backend/risk backend/data backend/agents scripts vws -c pyproject.toml && python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip --progress-spinner off --timeout 15 && python -m detect_secrets scan --all-files --exclude-files '(^|[\\/])(\.venv|backend[\\/]tests|deliveries|\.git|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.hypothesis|__pycache__|mutants|build|dist)[\\/]' > /tmp/vws-secrets.json && python -c "import json; from pathlib import Path; findings=json.loads(Path('/tmp/vws-secrets.json').read_text())['results']; print(findings); assert not findings"
      - name: Owner progress page updated with code
        run: |
          git diff-tree --root --no-commit-id --name-only -r HEAD > /tmp/vws-changed-files.txt
          python -c "from pathlib import Path; from vws.progress import read_progress, require_progress_update; read_progress(); require_progress_update(tuple(Path('/tmp/vws-changed-files.txt').read_text().splitlines()))"
      - name: Offline tests and complete risk/state branch coverage
        run: python -m pytest -q --cov=backend.core.system_state --cov=backend.risk --cov=backend.domain.compliance_models --cov-branch --cov-fail-under=100 --cov-report=term-missing
